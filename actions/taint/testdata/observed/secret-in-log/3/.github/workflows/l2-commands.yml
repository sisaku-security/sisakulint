name: l2-commands
on:
  push:
    branches: [probe/secret-in-log]
permissions: {}
env:
  WF_X: wf
jobs:
  unsecure:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - name: print
        continue-on-error: true
        run: |
          mkdir -p /tmp/c07bin /tmp/c12bin
          echo "::set-env name=C02::v02"
          echo "   ::set-env name=C03::v03"
          echo "pre ##[set-env name=C04;]v04"
          echo "::set-env name=C05::v05" >&2
          echo "::SET-ENV name=C06::v06"
          echo "::add-path::/tmp/c07bin"
          echo '::set-env name=BASH_ENV::$(echo C08-RAN >&2)'
          echo "::set-env name=NODE_OPTIONS::--c09"
          echo "::stop-commands::tok1234567"
          echo "::set-env name=C10::v10"
          echo "::tok1234567::"
          echo "pre ##[add-path]/tmp/c12bin"
          printf 'line1 %s\n' "::set-env name=C13::v13"
          printf 'x\n::set-env name=C14::v14\n'
      - name: after
        run: |
          echo "C02=[$C02] C03=[$C03] C04=[$C04] C05=[$C05] C06=[$C06] C10=[$C10] C13=[$C13] C14=[$C14] NODE_OPTIONS=[$NODE_OPTIONS]"
          echo "PATH=$PATH"
  stepflag:
    runs-on: ubuntu-latest
    steps:
      - name: flagged
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        run: echo "::set-env name=S1::v1"
      - name: unflagged
        continue-on-error: true
        run: echo "::set-env name=S2::v2"
      - name: after
        run: echo "S1=[$S1] S2=[$S2]"
  flagforms:
    runs-on: ubuntu-latest
    steps:
      - name: upper
        continue-on-error: true
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "TRUE"
        run: echo "::set-env name=F1::v1"
      - name: one
        continue-on-error: true
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "1"
        run: echo "::set-env name=F2::v2"
      - name: spaced
        continue-on-error: true
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: " true "
        run: echo "::set-env name=F3::v3"
      - name: viaenvfile
        run: echo "ACTIONS_ALLOW_UNSECURE_COMMANDS=true" >> "$GITHUB_ENV"
      - name: afterenvfile
        continue-on-error: true
        run: echo "::set-env name=F4::v4"
      - name: after
        run: echo "F1=[$F1] F2=[$F2] F3=[$F3] F4=[$F4]"
