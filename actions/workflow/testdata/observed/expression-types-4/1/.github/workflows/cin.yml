name: cin
on:
  workflow_call:
    inputs:
      n:
        type: number
        default: 1
      b:
        type: boolean
        default: false
      s:
        type: string
        default: x
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: echo "n=[${{ inputs.n }}] b=[${{ inputs.b }}] s=[${{ inputs.s }}]"
