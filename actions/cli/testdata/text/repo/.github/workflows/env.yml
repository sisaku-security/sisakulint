on: issues
jobs:
  greet:
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.issue.title }}
    steps:
      - run: echo "${{ env.TITLE }}"
      - run: echo "again ${{ env.TITLE }}"
      - run: echo "third ${{ env.TITLE }}"
      - run: echo "fourth ${{ env.TITLE }}"
permissions: {}
