on:
  workflow_call:
    inputs:
      s:
        type: string
      reqdef:
        type: string
        required: true
        default: d
      b:
        type: boolean
      n:
        type: number
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: echo "s=${{ inputs.s }} reqdef=${{ inputs.reqdef }} b=${{ inputs.b }} n=${{ inputs.n }}"
