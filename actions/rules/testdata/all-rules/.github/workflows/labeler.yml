# The workflow of actions/labeler that labeled.yml reads, of sisakulint.
# How to run it: the README of the all-rules example. Not for GitHub.
on: pull_request_target
permissions: {}
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # (dangerous-triggers.secrets: the job reads LABELER_PAT on
      # pull_request_target)
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.LABELER_PAT }}
