on: push
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          ALL: ${{ toJSON(secrets) }}
          CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      - run: echo "token starts with ${DEPLOY_TOKEN:0:4}"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
