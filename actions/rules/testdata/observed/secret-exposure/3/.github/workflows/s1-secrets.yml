# Which repository secrets reach a job's runner (it masks every one it gets),
# and whether a value taken out of a JSON secret by fromJSON is masked.
# Dummy values (not credentials), set as repository secrets:
#   PROBE_A    probe-a-canary-65a3a91b0584
#   PROBE_B    probe-b-canary-65a3a91b0584
#   PROBE_JSON {"user":"probe-user-65a3a91b0584","pass":"probe-pass-65a3a91b0584"}
# The step seen echoes the values without the secrets context: *** in the
# log means the runner got that secret.
on: push
permissions: {}
jobs:
  none:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
  named-a:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ secrets.PROBE_A }}
        run: "true"
  named-a-lower:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ secrets.probe_a }}
        run: "true"
  tojson:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ toJSON(secrets) }}
        run: "true"
  index-literal:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ secrets['PROBE_A'] }}
        run: "true"
  index-format:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ secrets[format('PROBE_{0}', 'A')] }}
        run: "true"
  star:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - env:
          X: ${{ join(secrets.*, ',') }}
        run: "true"
  if-false:
    runs-on: ubuntu-latest
    steps:
      - name: seen
        run: |
          echo "A=probe-a-canary-65a3a91b0584"
          echo "B=probe-b-canary-65a3a91b0584"
      - if: false
        env:
          X: ${{ toJSON(secrets) }}
        run: "true"
  json:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JOB_PASS: ${{ fromJSON(secrets.PROBE_JSON).pass }}
    steps:
      - name: seen
        run: |
          echo 'whole={"user":"probe-user-65a3a91b0584","pass":"probe-pass-65a3a91b0584"}'
          echo "user=probe-user-65a3a91b0584"
          echo "pass=probe-pass-65a3a91b0584"
      - name: env-pass
        env:
          P: ${{ fromJSON(secrets.PROBE_JSON).pass }}
        run: echo "p=$P"
      - name: run-user
        run: echo "u=${{ fromJSON(secrets.PROBE_JSON).user }}"
      - name: reserialized
        run: echo '${{ toJSON(fromJSON(secrets.PROBE_JSON)) }}'
      - name: object-in-string
        env:
          O: "o=${{ fromJSON(secrets.PROBE_JSON) }}"
        run: echo "$O"
      - name: compared
        env:
          C: ${{ fromJSON(secrets.PROBE_JSON).user == 'x' }}
        run: echo "c=$C"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: with-user
        uses: ./.github/actions/noop
        with:
          v: ${{ fromJSON(secrets.PROBE_JSON).user }}
