# situation: on issues, the step p prints the name of the label of the
#   event, and the release step writes the output tag of the step p into
#   its script.
# reason: only those who can write to the repository name a label, so no
#   outside attacker writes the printed value.
# cause: the webhook schema leaves the name free, and the table reads
#   the name as arbitrary.
# attack: an outside attacker cannot name a label.
# attack-run-behavior: the step prints the name of the label; nothing an
#   outsider wrote is read.
on: issues
permissions: {}
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: p
        run: echo "${{ github.event.label.name }}"
      - run: ./release.sh "${{ steps.p.outputs.tag }}"
