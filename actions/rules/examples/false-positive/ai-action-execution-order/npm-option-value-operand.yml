# situation: on issues opened, codex-action lets anyone start the agent,
#   in its default sandbox, which edits the workspace; a later step runs
#   npm version --preid beta.
# reason: a todo (the same file): npm version with no operand prints the
#   version of the package.json and runs no script of the workspace that the agent may edit; beta is the
#   value of the option --preid.
# cause: the rule reads beta as an operand of npm version, so the rule
#   reports ai-action-execution-order.edited-code.
# attack-value: the file package.json in the workspace that the agent may edit = "{\"scripts\":{\"preversion\":\"echo PWNED\"}}"
# attack-run-behavior: npm version --preid beta prints the version and does
#   not run the script preversion, so PWNED is not printed.
on:
  issues:
    types: [opened]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: "*"
          prompt: "Fix issue #${{ github.event.issue.number }}"
      - run: npm version --preid beta
