# situation: on issues labeled, a step passes the label's name to tar after
#   the file names, through env and inside quotes.
# reason: only those who can write to the repository create a label, so its
#   name is no attacker's.
# cause: the webhook schema gives the name no enum, and the table reads a
#   free string as arbitrary.
# attack-value: github.event.label.name = "--to-command=echo PWNED"
# attack-run-behavior: no attacker can name a label; were the name the
#   value, tar would read it as --to-command and run echo PWNED for
#   notes.txt as it extracts it.
on: {issues: {types: [labeled]}}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          LABEL: ${{ github.event.label.name }}
        run: tar -xf archive.tar notes.txt "$LABEL"
