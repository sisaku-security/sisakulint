# situation: on pull_request_target, a job checks out the head of the pull
#   request and runs pytest /opt/tests.
# reason: a todo (the same file): pytest collects the tests of /opt/tests only, and loads no
#   conftest.py and no test of the directory it runs in, so pytest runs no
#   code of the pull request.
# cause: the rule reads the directory that pytest runs in as a directory
#   whose tests pytest collects, so the rule reports untrusted-checkout.executed.
# attack-value: the file conftest.py in the pull request = "import os; os.system('echo PWNED')"
# attack-run-behavior: pytest /opt/tests does not import the conftest.py of the
#   attacker, so PWNED is not printed.
on: pull_request_target
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - run: pytest /opt/tests
