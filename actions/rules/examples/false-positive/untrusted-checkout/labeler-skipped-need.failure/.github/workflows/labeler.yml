on: pull_request_target
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
  report:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo reported
  label:
    needs: report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.LABELER_PAT }}
