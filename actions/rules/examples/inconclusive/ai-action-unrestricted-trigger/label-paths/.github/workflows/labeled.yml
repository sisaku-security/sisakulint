# situation: labeler.yml runs actions/labeler on pull_request_target with a
#   personal access token; the configuration .github/labeler.yml adds the
#   label safe-to-test to a pull request only when every file that the pull
#   request changes is under site/; labeled.yml runs on pull_request_target on
#   labeled when the label is safe-to-test, and the job runs
#   claude-code-action, which checks that the actor of the run has write
#   access to the repository, on the pull request.
# reason: the attacker gets the label only with files under site/, so the job
#   runs the code of the attacker only when the job runs code from files under
#   site/, which the rule does not read.
# attack-value: the file site/package.json in the pull request's head = "{\"scripts\":{\"preinstall\":\"echo PWNED\"}}"
# attack-run-behavior: the attacker opens a pull request from a fork that
#   changes only files under site/; actions/labeler adds the label
#   safe-to-test, which starts labeled.yml; the job runs the code of the
#   attacker only if the job runs code from files under site/.
on:
  pull_request_target:
    types: [labeled]
jobs:
  review:
    if: github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Review the pull request"
