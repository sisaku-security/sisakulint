# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/credentials-unknown, whose content is the
#   workflow of the true positive public (public.yml) of the rule, with on:
#   workflow_call in place of the on of public.yml. The linter asked the
#   fact workflow.definition for the reusable workflow and got no answer.
# reason: what the jobs of the reusable workflow do is in the file that the
#   linter could not read; whoever changes the uses, such as the author of a
#   pull request, can name a reusable workflow that the token that the
#   linter uses cannot read.
# attack: anyone reads the workflow file of the public repository, or a
#   clone or a fork of it, and takes the password hunter2 written in it.
# attack-run-behavior: the runner logs in to ghcr.io with u and hunter2, as
#   written, to pull the image; the registry takes the same pair from the
#   reader of the file, who logs in to the account outside the run.
on: push
permissions: {}
jobs:
  c:
    uses: example-org/credentials-unknown/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
