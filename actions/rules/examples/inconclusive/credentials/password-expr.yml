# situation: the job a logs in to its container with the password ${{ env.PW
#   }}, an env the workflow sets to a literal; the container of the job b is
#   ${{ fromJSON(vars.CONTAINER) }}.
# reason: neither password is read from secrets: the one of a is env.PW,
#   and the container of b, a whole ${{ }}, may be a mapping with
#   credentials whose password is the value of the repository variable
#   CONTAINER, which is not in any file. So whether the password is written
#   in the repository is not known.
# cause: the rule gives this kind to a password that reads any context
#   other than secrets and vars, without following env.PW to where the
#   workflow sets it, and to a container written as a whole ${{ }} (other
#   than values of the matrix), whose credentials it does not see.
# attack: when a password is a value written in the repository, as env.PW is
#   here (hunter2, set at the top of the file), whoever reads the workflow
#   file takes it.
# attack-run-behavior: the runner evaluates ${{ env.PW }} to hunter2 and
#   logs in to ghcr.io with u and hunter2, the pair the reader of the file
#   has; the container of job b is what vars.CONTAINER holds, and its
#   password is the one written in that variable, if any.
on: push
env:
  PW: hunter2
jobs:
  a:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/o/build@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      credentials:
        username: u
        password: ${{ env.PW }}
    steps:
      - run: echo
  b:
    runs-on: ubuntu-latest
    container: ${{ fromJSON(vars.CONTAINER) }}
    steps:
      - run: echo
