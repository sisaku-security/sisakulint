# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/unpinned-images-unknown, whose content is the
#   workflow of the true positive mutable (mutable.remote-action.yml) of the
#   rule, with on: workflow_call in place of the on of
#   mutable.remote-action.yml. The linter asked the fact workflow.definition
#   for the reusable workflow and got no answer.
# reason: what the jobs of the reusable workflow do is in the file that the
#   linter could not read; whoever changes the uses, such as the author of a
#   pull request, can name a reusable workflow that the token that the
#   linter uses cannot read.
# attack: whoever can push to ghcr.io/o/scan pushes an image of theirs under
#   the tag 1.
# attack-run-behavior: the runner pulls ghcr.io/o/scan:1, which is now that
#   image, and runs the step inside it with the workspace mounted.
on: push
permissions: {}
jobs:
  c:
    uses: example-org/unpinned-images-unknown/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
