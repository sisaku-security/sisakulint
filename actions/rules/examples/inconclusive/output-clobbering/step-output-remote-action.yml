# situation: the step s uses some/action@v1, an action of another
#   repository, and the next step writes steps.s.outputs.o to $GITHUB_OUTPUT
#   by ${{ }}.
# reason: the output is what that action sets, and its action.yml is not in
#   the input, so whether an attacker controls the output is not known.
# cause: the rule does not yet ask for the action.yml of another repository
#   as a fact.
# attack-value: steps.s.outputs.o = "x\nPWNED=1"
# attack-run-behavior: when some/action sets o to an attacker's text such as
#   this, ${{ }} puts its two lines inside the double quotes of the echo,
#   which writes the lines v=x and PWNED=1 to $GITHUB_OUTPUT, and the runner
#   sets the outputs v and PWNED.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: s
        uses: some/action@v1
      - run: echo "v=${{ steps.s.outputs.o }}" >> "$GITHUB_OUTPUT"
