# situation: the job a calls the reusable workflow
#   some/repo/.github/workflows/w.yml@v1 of another repository, and the job
#   b writes needs.a.outputs.o to $GITHUB_OUTPUT by ${{ }}.
# reason: the output is set in that reusable workflow, which is not in the
#   input, so whether an attacker controls it is not known.
# cause: the rule does not yet ask for the reusable workflow of another
#   repository as a fact.
# attack-value: needs.a.outputs.o = "x\nPWNED=1"
# attack-run-behavior: when some/repo's w.yml sets o to an attacker's text
#   such as this, ${{ }} puts its two lines inside the double quotes of the
#   echo, which writes the lines v=x and PWNED=1 to $GITHUB_OUTPUT, and the
#   runner sets the outputs v and PWNED.
on: issues
jobs:
  a:
    uses: some/repo/.github/workflows/w.yml@v1
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: echo "v=${{ needs.a.outputs.o }}" >> "$GITHUB_OUTPUT"
