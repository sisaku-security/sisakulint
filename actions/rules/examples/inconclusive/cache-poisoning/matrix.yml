# situation: on issues, a job with cache-mode: write saves build with
#   actions/cache/save under a key that has ${{ matrix.v }}.
# reason: what the value holds is not known from the workflow, so whether an
#   attacker controls it is not known.
# attack-value: matrix.v = "deps-Linux-5f4dcc3b5aa765d61d8327deb882cf99"
# attack-run-behavior: when ${{ matrix.v }} holds the value, the job saves
#   build to the cache of the default branch's scope under build-<value>, a key
#   the attacker chose.
on: issues
cache-mode: write
jobs:
  j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - v: ${{ vars.V }}
    steps:
      - uses: actions/cache/save@v4
        with:
          path: build
          key: build-${{ matrix.v }}
