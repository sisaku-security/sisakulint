# situation: the job a calls the reusable workflow
#   some/repo/.github/workflows/w.yml@v1 of another repository, and the job
#   b passes needs.a.outputs.o to tar after the file names, by ${{ }} inside
#   quotes.
# reason: the output is set in that reusable workflow, which is not in the
#   input, so whether an attacker controls it is not known.
# cause: the rule does not yet ask for the reusable workflow of another
#   repository as a fact.
# attack-value: needs.a.outputs.o = "--to-command=echo PWNED"
# attack-run-behavior: when some/repo/.github/workflows/w.yml@v1 sets its
#   output o to the value, tar in the job b reads the word as --to-command
#   and runs echo PWNED for notes.txt as it extracts it, which prints PWNED.
on: issues
jobs:
  a:
    uses: some/repo/.github/workflows/w.yml@v1
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: tar -xf archive.tar notes.txt "${{ needs.a.outputs.o }}"
