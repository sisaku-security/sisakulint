# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/argument-injection-unknown, whose content is
#   the workflow of the true positive option (option.arithmetic.yml) of the
#   rule, with on: workflow_call in place of the on of
#   option.arithmetic.yml. The linter asked the fact workflow.definition for
#   the reusable workflow and got no answer.
# reason: what the jobs of the reusable workflow do is in the file that the
#   linter could not read; whoever changes the uses, such as the author of a
#   pull request, can name a reusable workflow that the token that the
#   linter uses cannot read.
# attack-value: github.head_ref = "--to-command=sh${IFS}-c${IFS}id"
# attack-run-behavior: tar reads the word as --to-command and runs sh -c id
#   in the step, with what the step can reach.
on: pull_request_target
permissions: {}
jobs:
  c:
    uses: example-org/argument-injection-unknown/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
