# situation: the job a calls the reusable workflow ./.github/workflows/w.yml
#   of the same repository, and the job b passes needs.a.outputs.o to tar
#   after the file names, by ${{ }} inside quotes.
# reason: the output is set in that reusable workflow, another file, so
#   whether an attacker controls it is not known from this one.
# cause: the rule does not read the outputs a called workflow sets: it
#   gives this kind to needs.<id>.outputs of any job that calls a workflow
#   of the same repository, whether that workflow is among the files read
#   or not.
# attack-value: needs.a.outputs.o = "--to-command=echo PWNED"
# attack-run-behavior: when ./.github/workflows/w.yml sets its output o to
#   the value, tar in the job b reads the word as --to-command and runs echo
#   PWNED for notes.txt as it extracts it, which prints PWNED.
on: issues
jobs:
  a:
    uses: ./.github/workflows/w.yml
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: tar -xf archive.tar notes.txt "${{ needs.a.outputs.o }}"
