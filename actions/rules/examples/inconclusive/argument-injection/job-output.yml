# situation: the job a sets its output o from the output of its step s,
#   which a script writes to $GITHUB_OUTPUT; the job b passes
#   needs.a.outputs.o to tar after the file names, by ${{ }} inside quotes.
# reason: the value is what another job computes at run time, so whether an
#   attacker controls it is not known.
# cause: the rule does not yet follow the output of a job back to what sets
#   it.
# attack-value: needs.a.outputs.o = "--to-command=echo PWNED"
# attack-run-behavior: when the step s writes o with the value to
#   $GITHUB_OUTPUT, tar in the job b reads the word as --to-command and runs
#   echo PWNED for notes.txt as it extracts it, which prints PWNED.
on: issues
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      o: ${{ steps.s.outputs.o }}
    steps:
      - id: s
        run: echo "o=x" >> "$GITHUB_OUTPUT"
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: tar -xf archive.tar notes.txt "${{ needs.a.outputs.o }}"
