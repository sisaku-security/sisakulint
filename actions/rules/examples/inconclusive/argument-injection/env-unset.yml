# situation: a step passes env.NOWHERE, an env the workflow does not set, to
#   tar after the file names, by ${{ }} inside quotes.
# reason: a step before may set it at run time through $GITHUB_ENV, so what
#   it holds, and whether an attacker controls it, is not known.
# attack-value: env.NOWHERE = "--to-command=echo PWNED"
# attack-run-behavior: when a step before writes NOWHERE with the value to
#   $GITHUB_ENV, tar reads the word as --to-command and runs echo PWNED for
#   notes.txt as it extracts it, which prints PWNED.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: tar -xf archive.tar notes.txt "${{ env.NOWHERE }}"
