# situation: the workflow runs on workflow_dispatch with the input x, and a
#   step passes inputs.x and github.event.inputs.x to tar after the file
#   names, by ${{ }} inside quotes.
# reason: whoever dispatches the workflow chooses the value, and the
#   workflow does not tell who that is, so whether an attacker controls it
#   is not known; nothing the rule could read is expected to tell it.
# attack-value: inputs.x = "--to-command=echo PWNED"
# attack-run-behavior: when the one who dispatches the workflow gives the
#   value as x, which inputs.x and github.event.inputs.x both hold, tar
#   reads both words as --to-command and runs echo PWNED for notes.txt as it
#   extracts it, which prints PWNED.
on:
  workflow_dispatch:
    inputs:
      x: {}
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: tar -xf archive.tar notes.txt "${{ inputs.x }}" "${{ github.event.inputs.x }}"
