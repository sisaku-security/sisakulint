# situation: on issues, a step prints a value of the matrix that a variable
#   of the repository sets. The job sets ACTIONS_ALLOW_UNSECURE_COMMANDS to
#   true, and a step comes after.
# reason: the value of the matrix is known at run time only. Whether an
#   attacker controls the printed value is not known.
# cause: the rule does not read the value of vars.
# attack: an attacker who controls the value writes ##[set-env
#   name=BASH_ENV;]$(id) in it.
# attack-run-behavior: the step prints the value; were the value an
#   attacker's ##[set-env name=BASH_ENV;]$(id), the runner would set
#   BASH_ENV, and the bash of the next step would run id.
on: issues
permissions: {}
jobs:
  j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - v: ${{ vars.V }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - run: echo "${{ matrix.v }}"
      - run: echo next
