# situation: on issues, a step prints env.NOWHERE, which no env of the
#   workflow sets. The job sets ACTIONS_ALLOW_UNSECURE_COMMANDS to true, and
#   a step comes after.
# reason: a step before may set it in $GITHUB_ENV at run time. Whether an
#   attacker controls the printed value is not known.
# cause: the rule reads env of the workflow, not what a step writes to
#   $GITHUB_ENV.
# attack: an attacker who controls the value writes ##[set-env
#   name=BASH_ENV;]$(id) in it.
# attack-run-behavior: the step prints the value; were the value an
#   attacker's ##[set-env name=BASH_ENV;]$(id), the runner would set
#   BASH_ENV, and the bash of the next step would run id.
on: issues
permissions: {}
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - run: echo "${{ env.NOWHERE }}"
      - run: echo next
