# situation: the matrix value v is ${{ vars.V }}, not written out in the
#   workflow, and a step writes matrix.v to $GITHUB_PATH by ${{ }}.
# reason: what the value holds is not known from the workflow, so whether an
#   attacker controls it is not known.
# attack-value: matrix.v = "x\n/tmp/PWNED"
# attack-run-behavior: when vars.V holds a value an attacker wrote, such as
#   this one, the script writes the lines v=x and /tmp/PWNED to
#   $GITHUB_PATH, and the steps after it get /tmp/PWNED first in PATH.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - v: ${{ vars.V }}
    steps:
      - run: echo "v=${{ matrix.v }}" >> "$GITHUB_PATH"
