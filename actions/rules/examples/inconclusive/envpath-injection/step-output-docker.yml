# situation: the step s runs the Docker image docker://alpine:3, and the
#   next step writes steps.s.outputs.o to $GITHUB_PATH by ${{ }}.
# reason: the image writes the output at run time; nothing the rule could
#   read is expected to tell what it writes, so whether an attacker controls
#   it is not known.
# attack-value: steps.s.outputs.o = "x\n/tmp/PWNED"
# attack-run-behavior: when the program of docker://alpine:3 writes to o a
#   value an attacker wrote, such as this one, the script writes the lines
#   v=x and /tmp/PWNED to $GITHUB_PATH, and the steps after it get
#   /tmp/PWNED first in PATH.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: s
        uses: docker://alpine:3
      - run: echo "v=${{ steps.s.outputs.o }}" >> "$GITHUB_PATH"
