# situation: the job a calls the reusable workflow
#   some/repo/.github/workflows/w.yml@v1 of another repository, and the job
#   b writes needs.a.outputs.o to $GITHUB_PATH by ${{ }}.
# reason: the output is set in that reusable workflow, which is not in the
#   input, so whether an attacker controls it is not known.
# cause: the rule does not yet ask for the reusable workflow of another
#   repository as a fact.
# attack-value: needs.a.outputs.o = "x\n/tmp/PWNED"
# attack-run-behavior: when some/repo/.github/workflows/w.yml@v1 sets o from
#   a value an attacker wrote, such as the issue's body, the script writes
#   the lines v=x and /tmp/PWNED to $GITHUB_PATH, and the steps after it get
#   /tmp/PWNED first in PATH.
on: issues
jobs:
  a:
    uses: some/repo/.github/workflows/w.yml@v1
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: echo "v=${{ needs.a.outputs.o }}" >> "$GITHUB_PATH"
