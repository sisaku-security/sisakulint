# situation: the step s runs a script that writes the output o to
#   $GITHUB_OUTPUT, and the next step writes steps.s.outputs.o to
#   $GITHUB_PATH by ${{ }}.
# reason: the output is what the script writes at run time, so whether an
#   attacker controls it is not known.
# cause: the rule does not yet follow what a script writes to
#   $GITHUB_OUTPUT.
# attack-value: steps.s.outputs.o = "x\n/tmp/PWNED"
# attack-run-behavior: when the step s writes to o a value an attacker
#   wrote, such as this one, the script writes the lines v=x and /tmp/PWNED
#   to $GITHUB_PATH, and the steps after it get /tmp/PWNED first in PATH. As
#   written, s writes o=x, and the line is v=x.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: s
        run: echo "o=x" >> "$GITHUB_OUTPUT"
      - run: echo "v=${{ steps.s.outputs.o }}" >> "$GITHUB_PATH"
