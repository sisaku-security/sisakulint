# situation: the step s uses some/action@v1, an action of another
#   repository, and the next step writes steps.s.outputs.o to $GITHUB_PATH
#   by ${{ }}.
# reason: the output is what that action sets, and its action.yml is not in
#   the input, so whether an attacker controls the output is not known.
# cause: the rule does not yet ask for the action.yml of another repository
#   as a fact.
# attack-value: steps.s.outputs.o = "x\n/tmp/PWNED"
# attack-run-behavior: when some/action@v1 sets o from a value an attacker
#   wrote, such as the issue's body, the script writes the lines v=x and
#   /tmp/PWNED to $GITHUB_PATH, and the steps after it get /tmp/PWNED first
#   in PATH.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: s
        uses: some/action@v1
      - run: echo "v=${{ steps.s.outputs.o }}" >> "$GITHUB_PATH"
