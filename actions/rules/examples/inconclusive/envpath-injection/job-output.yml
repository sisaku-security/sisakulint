# situation: the job a sets its output o from the output of its step s,
#   which a script writes to $GITHUB_OUTPUT; the job b writes
#   needs.a.outputs.o to $GITHUB_PATH by ${{ }}.
# reason: the value is what another job computes at run time, so whether an
#   attacker controls it is not known.
# cause: the rule does not yet follow the output of a job back to what sets
#   it.
# attack-value: needs.a.outputs.o = "x\n/tmp/PWNED"
# attack-run-behavior: when the step s writes to o a value an attacker
#   wrote, such as this one, the script of b writes the lines v=x and
#   /tmp/PWNED to $GITHUB_PATH, and the steps after it get /tmp/PWNED first
#   in PATH. As written, s writes o=x, and the line is v=x.
on: issues
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      o: ${{ steps.s.outputs.o }}
    steps:
      - id: s
        run: echo "o=x" >> "$GITHUB_OUTPUT"
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: echo "v=${{ needs.a.outputs.o }}" >> "$GITHUB_PATH"
