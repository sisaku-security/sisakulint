# situation: labeler.yml runs actions/labeler on pull_request_target with a
#   personal access token; the configuration .github/labeler.yml adds the
#   label safe-to-test to a pull request that changes a file under site/, and
#   the label docs to a pull request whose head branch starts with pages/;
#   labeled.yml runs on pull_request_target on labeled when the pull request
#   has both labels, and the job checks out the head of the pull request and
#   runs npm ci.
# reason: the attacker gets both labels with one pull request, and the job
#   runs when the labels of the pull request in the payload of the labeled run
#   include both, which the authors of the rule did not observe for labels
#   that one request of actions/labeler adds.
# attack-value: the file package.json in the pull request's head = "{\"scripts\":{\"preinstall\":\"echo PWNED\"}}"
# attack-run-behavior: the attacker opens a pull request from a fork whose
#   head branch starts with pages/ and that changes a file under site/;
#   actions/labeler adds both labels, which start labeled.yml; when the
#   payload lists both labels, the checkout fetches the head of the pull
#   request, and npm ci runs the preinstall script of the pull request, which
#   prints PWNED, with the secrets of the repository.
on:
  pull_request_target:
    types: [labeled]
jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'safe-to-test') && contains(github.event.pull_request.labels.*.name, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
