# situation: the matrix value v is ${{ vars.V }}, not written out in the
#   workflow, and a step writes matrix.v to $GITHUB_ENV by ${{ }}.
# reason: what the value holds is not known from the workflow, so whether an
#   attacker controls it is not known.
# attack-value: matrix.v = "x\nPWNED=1"
# attack-run-behavior: when vars.V holds an attacker's text such as this
#   value, the script becomes echo "v=x<line break>PWNED=1" >>
#   "$GITHUB_ENV", which appends v=x and PWNED=1; the runner sets v to x and
#   PWNED to 1.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - v: ${{ vars.V }}
    steps:
      - run: echo "v=${{ matrix.v }}" >> "$GITHUB_ENV"
