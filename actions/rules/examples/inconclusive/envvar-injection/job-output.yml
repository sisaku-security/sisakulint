# situation: the job a sets its output o from the output of its step s,
#   which a script writes to $GITHUB_OUTPUT; the job b writes
#   needs.a.outputs.o to $GITHUB_ENV by ${{ }}.
# reason: the value is what another job computes at run time, so whether an
#   attacker controls it is not known.
# cause: the rule does not yet follow the output of a job back to what sets
#   it.
# attack-value: needs.a.outputs.o = "x\nPWNED=1"
# attack-run-behavior: here s writes o=x, so o is x and b appends the one
#   line v=x. Were o this value (a script of s that writes an attacker's
#   text as o), the script of b would become echo "v=x<line break>PWNED=1"
#   >> "$GITHUB_ENV", which appends v=x and PWNED=1, and the runner would
#   set PWNED to 1.
on: issues
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      o: ${{ steps.s.outputs.o }}
    steps:
      - id: s
        run: echo "o=x" >> "$GITHUB_OUTPUT"
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: echo "v=${{ needs.a.outputs.o }}" >> "$GITHUB_ENV"
