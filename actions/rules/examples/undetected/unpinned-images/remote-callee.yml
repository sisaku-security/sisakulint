# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/unpinned-images-unanswered, whose content is
#   the workflow of the true positive mutable (mutable.remote-action.yml) of
#   the rule, with on: workflow_call in place of the on of
#   mutable.remote-action.yml. The linter has no answer of the fact
#   workflow.definition for the reusable workflow.
# reason: a todo (a fact): the jobs of a reusable workflow run on the event
#   that started the run of the calling job, and the linter does not read
#   the reusable workflow.
# cause: the rule reads a reusable workflow of another repository only from
#   the answer of workflow.definition.
# attack: whoever can push to ghcr.io/o/scan pushes an image of theirs under
#   the tag 1.
# attack-run-behavior: the runner pulls ghcr.io/o/scan:1, which is now that
#   image, and runs the step inside it with the workspace mounted.
on: push
permissions: {}
jobs:
  c:
    uses: example-org/unpinned-images-unanswered/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
