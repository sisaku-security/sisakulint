# situation: labeler.yml runs on schedule, finds the number of the newest open
#   pull request, and runs actions/labeler on the pull request of the number
#   with a personal access token; the configuration .github/labeler.yml adds
#   the label safe-to-test to a pull request that changes a file under site/;
#   labeled.yml runs on pull_request_target on labeled when the label is
#   safe-to-test, and the job reads the secret NPM_TOKEN, checks out the head
#   of the pull request and runs npm ci.
# reason: the pull request of the attacker is open, so the run on schedule
#   runs actions/labeler on the pull request of the attacker, and a label that
#   the token adds starts the labeled run, so no person approves the run
#   before the label starts the run.
# cause: the rule reads actions/labeler on the events of a pull request only,
#   and does not read the step that finds the number of the pull request for
#   pr-number.
# attack-value: the file package.json in the pull request's head = "{\"scripts\":{\"preinstall\":\"echo PWNED\"}}"
# attack-run-behavior: the attacker opens a pull request from a fork that
#   changes a file under site/; when labeler.yml runs on schedule,
#   actions/labeler adds the label safe-to-test, which starts labeled.yml, and
#   npm ci runs the preinstall script of the pull request, which prints PWNED,
#   with NPM_TOKEN in its env.
on:
  pull_request_target:
    types: [labeled]
permissions: {}
jobs:
  build:
    if: github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
