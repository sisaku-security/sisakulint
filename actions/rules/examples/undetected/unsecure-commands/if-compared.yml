# situation: on issue_comment, a job that sets ACTIONS_ALLOW_UNSECURE_COMMANDS
#   to true runs only when the comment's body is bash_env, and a step prints
#   a set-env command whose name is ${{ github.event.comment.body }}; another
#   step of the job runs after the step.
# reason: the job's if lets the body be only the string bash_env, ignoring
#   the case of its letters, so the body is no workflow command; the
#   attacker still chooses the case, and BASH_ENV is the variable whose file
#   bash reads before each later script.
# cause: the rule does not treat a value that the if of the job compares
#   with such a string as written by the attacker.
# attack-value: github.event.comment.body = "BASH_ENV"
# attack-run-behavior: the if passes, the step prints
#   ::set-env name=BASH_ENV::./setup.sh, and the runner sets BASH_ENV for
#   the later steps.
on:
  issue_comment:
    types: [created]
jobs:
  j:
    if: github.event.comment.body == 'bash_env'
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - run: echo "::set-env name=${{ github.event.comment.body }}::./setup.sh"
      - run: echo next
