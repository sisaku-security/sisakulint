# situation: ci.yml of the repository o/r calls this reusable workflow on
#   pull_request_review_comment by the name
#   o/r/.github/workflows/called.yml@main, not by the path
#   ./.github/workflows/called.yml; the job runs ./deploy.sh with the secret
#   DEPLOY_TOKEN only if contains('alice bob', the commenter's login) holds.
# reason: a todo (the same file): when the run of the linter names the
#   repository (--repo o/r), the call by the name is a call of this file, and
#   on pull_request_review_comment any login that is a part of 'alice bob',
#   such as ali, passes the if. A run without --repo reads o/r as another
#   repository, and reports nothing either.
# cause: the rule does not resolve a call by the name of the repository to
#   the file, so the rule reads the if on every event; on push the login is
#   empty and contains('alice bob', '') is true, and the rule reports a
#   comparison only when the login is the attacker's in every run that the
#   if lets in.
# attack-value: github.event.comment.user.login = "ali"
# attack-run-behavior: a comment by the account ali on the diff of a pull
#   request whose branch is in the repository starts ci.yml, which runs this
#   workflow; contains('alice bob', 'ali') is true, so ./deploy.sh runs with
#   TOKEN set to the value of DEPLOY_TOKEN.
on: workflow_call
jobs:
  deploy:
    if: contains('alice bob', github.event.comment.user.login)
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
