# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/credentials-unanswered, whose content is the
#   workflow of the true positive public (public.yml) of the rule, with on:
#   workflow_call in place of the on of public.yml. The linter has no answer
#   of the fact workflow.definition for the reusable workflow.
# reason: a todo (a fact): the jobs of a reusable workflow run on the event
#   that started the run of the calling job, and the linter does not read
#   the reusable workflow.
# cause: the rule reads a reusable workflow of another repository only from
#   the answer of workflow.definition.
# attack: anyone reads the workflow file of the public repository, or a
#   clone or a fork of it, and takes the password hunter2 written in it.
# attack-run-behavior: the runner logs in to ghcr.io with u and hunter2, as
#   written, to pull the image; the registry takes the same pair from the
#   reader of the file, who logs in to the account outside the run.
on: push
permissions: {}
jobs:
  c:
    uses: example-org/credentials-unanswered/.github/workflows/w.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
