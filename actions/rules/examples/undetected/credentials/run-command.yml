# situation: on push, a run logs in with a password written in it.
# reason: a todo (the same file): reading the command would find the
#   password.
# cause: the rule does not read the commands of a run.
# attack: anyone reads the workflow file of the public repository, or a
#   clone or a fork of it, and takes the password hunter2 written in the
#   run.
# attack-run-behavior: docker login logs in to ghcr.io with u and hunter2,
#   as written in the run, and the runner also prints the script, with the
#   password, to the log of the step.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: docker login -u u -p hunter2 ghcr.io
