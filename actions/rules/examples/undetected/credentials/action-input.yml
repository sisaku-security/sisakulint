# situation: on push, docker/login-action takes the password hunter2 as an
#   input.
# reason: a todo (a fact): which inputs of an action are credentials is not
#   known.
# cause: the rule reads the password of the credentials of a job's container
#   or service only.
# attack: anyone reads the workflow file of the public repository, or a
#   clone or a fork of it, and takes the password hunter2 written in the
#   with of docker/login-action.
# attack-run-behavior: docker/login-action logs in to Docker Hub, its
#   registry when none is given, with u and hunter2; the registry takes the
#   same pair from the reader of the file.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@0123456789abcdef0123456789abcdef01234567
        with:
          username: u
          password: hunter2
