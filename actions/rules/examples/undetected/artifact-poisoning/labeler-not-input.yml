# situation: the linter is given labeled.yml alone; the repository also has a
#   workflow that runs actions/labeler on pull_request_target with a personal
#   access token and adds the label safe-to-test to a pull request that
#   changes a file under site/; labeled.yml runs on pull_request_target on
#   labeled when the label is safe-to-test, and the job downloads the artifact
#   out of the run that the output of a step names, and runs ./out/publish.sh.
# reason: the workflow that runs actions/labeler adds the label to the pull
#   request of the attacker, so no person approves the run before the label
#   starts the run.
# cause: the run of the linter reads only the files that it names, so the rule
#   does not read the workflow that runs actions/labeler.
# attack-value: the file out/publish.sh in the artifact of a run of the pull request = "#!/bin/sh\necho PWNED\n"
# attack-run-behavior: the attacker opens a pull request from a fork that
#   changes a file under site/ and the files of the attack; actions/labeler
#   adds the label safe-to-test, which starts labeled.yml, and when the step
#   names a run of the workflow build.yml of the pull request, the download
#   puts the out/publish.sh of the attacker in out, and the step runs the
#   file, which prints PWNED, with the secrets of the repository.
on:
  pull_request_target:
    types: [labeled]
jobs:
  build:
    if: github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    steps:
      - id: run
        run: echo "id=$(gh run list --workflow build.yml --json databaseId -q '.[0].databaseId')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - run: ./out/publish.sh
