# situation: on issues of an activity type added_later, a run writes the
#   issue's title to $GITHUB_PATH.
# reason: a todo (a pin update): an activity type GitHub added after the
#   pinned schemas is missed until the pins are updated.
# cause: the analysis drops a value of types it does not know, as GitHub
#   does for a value it has no such activity type for, so the job has no
#   attacker's event.
# attack-value: github.event.issue.title = "/tmp/PWNED"
# attack-run-behavior: on an issues event of the type added_later, the
#   script becomes echo "/tmp/PWNED" >> "$GITHUB_PATH": the line /tmp/PWNED
#   goes to $GITHUB_PATH, and the steps after it get /tmp/PWNED first in
#   PATH.
on:
  issues:
    types: [added_later]
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.issue.title }}" >> "$GITHUB_PATH"
