# situation: on workflow_dispatch, a run writes github.event.issue.body to
#   $GITHUB_PATH. If the workflow also ran on issues, the rule would report
#   the same step.
# reason: no added gain: on workflow_dispatch the event has no issue object,
#   so the expression of the body gives an empty string; whoever dispatches
#   the workflow chooses the ref and the inputs of the dispatch, and the step
#   reads no input of the dispatch.
# cause: the table of the attacker's events that the rule reads does not
#   have workflow_dispatch; the rule reports an input of a dispatch with the
#   inconclusive kind input-dispatch.
# attack-value: github.event.issue.body = "/tmp/PWNED"
# attack-run-behavior: with the value put in, the script writes the line
#   /tmp/PWNED to $GITHUB_PATH, and the steps after it get /tmp/PWNED first
#   in PATH. On workflow_dispatch the event has no issue object, though: the
#   expression gives an empty string, and the empty line is skipped.
on: workflow_dispatch
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.issue.body }}" >> "$GITHUB_PATH"
