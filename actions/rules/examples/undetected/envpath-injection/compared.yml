# situation: on issues, a run writes to $GITHUB_PATH the issue's body given
#   to contains and compared with ==.
# reason: no added gain: what is written out is a bool.
# cause: the rule reads the value of a comparison or of contains as a bool,
#   not the attacker's text.
# attack-value: github.event.issue.body = "x\n/tmp/PWNED"
# attack-run-behavior: contains finds x in the body and == finds the body
#   not equal to x, so the script becomes echo "true false" >>
#   "$GITHUB_PATH": the line true false goes to $GITHUB_PATH, and no line of
#   the body does.
on: issues
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ contains(github.event.issue.body, 'x') }} ${{ github.event.issue.body == 'x' }}" >> "$GITHUB_PATH"
