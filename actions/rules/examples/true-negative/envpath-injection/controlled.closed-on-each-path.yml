# situation: on issues opened, a step opens a descriptor on $GITHUB_PATH
#   with exec {fd} when QUIET is empty and on /dev/null otherwise, closes
#   the descriptor whose number fd holds with exec {fd}>&-, writes the
#   issue's title to the descriptor whose number fd holds, and goes on when
#   the write fails (|| true); the next step runs git status.
# reason: exec {fd}>&- closes the descriptor that exec {fd} in the branch of
#   if opened, so the write fails on both paths, and the title does not go
#   to $GITHUB_PATH.
# attack-value: github.event.issue.title = "/tmp/PWNED"
# attack-run-behavior: the write fails with a bad file descriptor, || true
#   keeps the step going, and the PATH of the next step has no /tmp/PWNED.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ github.event.issue.title }}
        run: |
          if [ -z "$QUIET" ]; then exec {fd}>>"$GITHUB_PATH"; else exec {fd}>/dev/null; fi
          exec {fd}>&-
          echo "$V" >&$fd || true
      - run: git status
