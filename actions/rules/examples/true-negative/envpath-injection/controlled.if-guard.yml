# situation: on an opened issue, a step writes the issue's title to
#   $GITHUB_PATH; the step's if lets it run only when the issue's
#   author_association is OWNER.
# reason: the if skips the step for an issue an outsider opens, whose
#   author_association is not OWNER, so only a title the owner wrote is
#   written to $GITHUB_PATH.
# attack-value: github.event.issue.title = "/tmp/PWNED"
# attack-run-behavior: the attacker's issue has author_association NONE,
#   FIRST_TIMER, FIRST_TIME_CONTRIBUTOR or CONTRIBUTOR, so the if is false
#   and the step is skipped: nothing is written to $GITHUB_PATH, and the
#   PATH of the job stays as the runner set it.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.issue.author_association == 'OWNER'
        env:
          V: ${{ github.event.issue.title }}
        run: echo "$V" >> "$GITHUB_PATH"
