# situation: on issues opened, a step sets out to $GITHUB_PATH, sets it
#   again to /dev/null, and writes the issue's title to "$out".
# reason: the second assignment points out at /dev/null, so the title goes
#   nowhere and the PATH does not change.
# attack-value: github.event.issue.title = "/tmp/PWNED"
# attack-run-behavior: out is /dev/null when echo runs, so /tmp/PWNED goes
#   to /dev/null, and the runner adds no directory to the PATH.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ github.event.issue.title }}
        run: |
          out=$GITHUB_PATH
          out=/dev/null
          echo "$V" >> "$out"
