# situation: after a checkout, a step uses ./.github/actions/setup.
# reason: the path names a directory of the checked-out repository.
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
