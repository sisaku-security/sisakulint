# situation: the workflow runs on pull_request_target; the job report needs
#   the job build, has the if contains(needs.*.result, 'failure'), and runs
#   echo with the title of the pull request written in the script by a ${{ }}.
# reason: GitHub evaluates the if of the job report, which calls no status
#   function, only when the job build succeeded, where needs.*.result is
#   the array of success, so the if is false; when the job build fails or
#   is skipped, GitHub skips the job report; so the job report does not run
#   (https://github.com/github/docs/blob/404a5f4de6cd5311e3ce2d5c076571291e0107d6/content/actions/reference/workflows-and-actions/expressions.md,
#   status check functions).
# attack-value: github.event.pull_request.title = "$(echo PWNED)"
# attack-run-behavior: the attacker opens a pull request from a fork; GitHub
#   runs the job build, and the if of the job report is false, so the job
#   report does not run.
on: pull_request_target
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo built
  report:
    needs: build
    if: contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.title }}"
