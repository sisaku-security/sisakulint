# situation: the workflow runs on pull_request_target; the if of the job
#   check is github.head_ref == 'release'; the job report needs the job
#   check, has no if, and runs echo with github.head_ref written in the
#   script by a ${{ }}.
# reason: GitHub runs the job report only after the job check succeeded,
#   and runs the job check only when github.head_ref equals release, ignoring
#   the case of the letters; github.head_ref is the same in every job of a
#   run, so in the job report the github.head_ref value is release in upper
#   case or lower case letters, and a github.head_ref value of release in
#   upper case or lower case letters holds no shell code
#   (https://github.com/github/docs/blob/404a5f4de6cd5311e3ce2d5c076571291e0107d6/data/reusables/actions/jobs/section-using-jobs-in-a-workflow-needs.md).
# attack-value: github.head_ref = "$(echo PWNED)"
# attack-run-behavior: the attacker opens a pull request from a fork whose
#   branch is named $(echo PWNED); the if of the job check is false, so
#   GitHub skips the job check and the job report.
on: pull_request_target
permissions: {}
jobs:
  check:
    if: github.head_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: echo checked
  report:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.head_ref }}"
