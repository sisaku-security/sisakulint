# situation: on gollum, a step takes the newlines out of the wiki page's
#   title (tr -d '\n') and then writes it to $GITHUB_OUTPUT as page=.
# reason: in the written line, a newline of the wiki page's title is what
#   would set another output of the step; with every newline taken out, all
#   of it stays the value of the one line page=.
# attack-value: github.event.pages[0].title = "x\nPWNED=1"
# attack-run-behavior: tr -d '\n' takes the line break out, so echo writes the
#   one line page=xPWNED=1 to $GITHUB_OUTPUT, and the runner sets the output
#   page to xPWNED=1 and no PWNED.
on: gollum
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          PAGE: ${{ github.event.pages[0].title }}
        run: echo "page=$(printf '%s' "${PAGE}" | tr -d '\n')" >> "$GITHUB_OUTPUT"
