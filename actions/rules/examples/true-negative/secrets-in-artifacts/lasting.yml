# situation: google-github-actions/auth writes the service account key of
#   secrets.GCP_KEY to gha-creds-*.json in the workspace, and the upload
#   takes only dist/.
# reason: the upload's path is dist/, not the workspace, and
#   gha-creds-*.json is at the top of the workspace, outside dist/, so the
#   artifact does not hold the key.
# attack: a reader of the repository's artifacts (anyone, in a public
#   repository) downloads the artifact through the API, and takes the
#   service account key from gha-creds-*.json.
# attack-run-behavior: the upload takes dist/ only, and gha-creds-<hex>.json
#   is at the top of the workspace, so the artifact holds no key, and the
#   reader takes none.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          path: dist/
