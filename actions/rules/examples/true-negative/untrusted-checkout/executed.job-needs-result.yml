# situation: the workflow runs on pull_request_target; the job test needs
#   the job build, has the if needs.build.result == 'failure', checks out the
#   head of the pull request, and runs npm ci.
# reason: GitHub evaluates the if of the job test, which calls no status
#   function, only when the job build succeeded, where needs.build.result is
#   success, so the if is false; when the job build fails or is skipped,
#   GitHub skips the job test; so the job test does not run
#   (https://github.com/github/docs/blob/404a5f4de6cd5311e3ce2d5c076571291e0107d6/content/actions/reference/workflows-and-actions/expressions.md,
#   status check functions).
# attack-value: the file package.json in the pull request's head = "{\"scripts\":{\"preinstall\":\"echo PWNED\"}}"
# attack-run-behavior: the attacker opens a pull request from a fork; GitHub
#   runs the job build, and the if of the job test is false, so the job test
#   does not run.
on: pull_request_target
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo built
  test:
    needs: build
    if: needs.build.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
