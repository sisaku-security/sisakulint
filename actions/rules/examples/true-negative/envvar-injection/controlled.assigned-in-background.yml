# situation: on issues opened, a step sets out to $GITHUB_ENV in a command
#   ended by &, waits for it, and writes V= and the issue's body to "$out",
#   and goes on when the write fails (|| true).
# reason: bash runs a command ended by & in a subshell, so after it out is
#   empty, and the body does not go to $GITHUB_ENV.
# attack-value: github.event.issue.body = "x\nPWNED=1"
# attack-run-behavior: out is empty when echo runs, so bash cannot open the
#   file and writes nothing, || true keeps the step going, and the runner
#   sets no environment variable.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ github.event.issue.body }}
        run: |
          out=$GITHUB_ENV & wait
          echo "V=$V" >> "$out" || true
