# situation: on issues opened, a step opens descriptor 3 on $GITHUB_ENV with
#   exec, defines a function that writes V= and the issue's body to
#   descriptor 3, and calls the function in ( ... ) after it closes
#   descriptor 3 there; the call goes on when the write fails (|| true).
# reason: the function runs where it is called, where descriptor 3 is
#   closed, so the body does not go to $GITHUB_ENV.
# attack-value: github.event.issue.body = "x\nPWNED=1"
# attack-run-behavior: bash reports a bad file descriptor, || true keeps the
#   step going, and the runner sets no environment variable.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ github.event.issue.body }}
        run: |
          exec 3>> "$GITHUB_ENV"
          f() { echo "V=$V" >&3; }
          ( exec 3>&-; f || true )
