# situation: on issues opened, a step runs exec 3>> "$GITHUB_ENV" as the
#   first command of a pipeline whose second command writes the issue's body
#   to descriptor 3, and goes on when the write fails (|| true).
# reason: bash runs each command of the pipeline in a subshell of its own,
#   so descriptor 3 that the exec opens is not open in the subshell of the
#   echo, and nothing reaches $GITHUB_ENV.
# attack-value: github.event.issue.body = "x\nPWNED=1"
# attack-run-behavior: descriptor 3 is not open when echo runs, so bash
#   reports a bad file descriptor, || true keeps the step going, and the
#   runner gets no environment variable from the value.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ github.event.issue.body }}
        run: exec 3>> "$GITHUB_ENV" | echo "V=$V" >&3 || true
