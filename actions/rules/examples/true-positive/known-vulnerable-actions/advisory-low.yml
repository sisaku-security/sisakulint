# situation: a job installs kubectl with Azure/setup-kubectl pinned to the
#   commit of v2.1, runs npm ci and the tests, and then kubectl with a
#   secret.
# reason: GHSA-p756-rfxh-x63h, which GitHub rates low, says versions v2 and
#   lower make the kubectl binary world writable (fs.chmodSync(kubectlPath,
#   777)), so that "other actors on the Actions runner" can replace it.
# attack: an install script of a dependency npm ci fetches, or any other
#   process on the runner, writes a kubectl of its own over the binary.
# attack-run-behavior: the later step runs the replaced kubectl with the
#   secret of the cluster in its environment.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/setup-kubectl@6025c840858f1afa584a5190a4426c338f59e503 # v2.1
      - run: npm ci && npm test
      - run: kubectl apply -f deploy.yaml
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
