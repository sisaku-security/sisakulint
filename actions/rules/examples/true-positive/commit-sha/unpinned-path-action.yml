# situation: the first step uses a composite action pinned to a full SHA,
#   whose action.yml uses actions/github-script@v7; the second step names
#   the same composite action by a full SHA, but its path goes with .. above
#   the root of the repository, to actions/github-script/v7.
# reason: the runner puts each action that the job uses, a composite
#   action's own uses among them, in _actions/<owner>/<repo>/<ref>, and
#   reads the path of the second step from the directory of the composite
#   action there; the second step runs actions/github-script at the tag v7,
#   which the full SHA after @ does not decide.
# attack: the owner of actions/github-script, or whoever has taken over a
#   token that pushes to it, moves the tag v7 to a commit of theirs.
# attack-run-behavior: when the job runs, the runner downloads the commit
#   that v7 names for the composite action's uses, and the second step runs
#   that commit with the step's script, in the job's workspace and
#   environment.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: example-org/ci-tools/setup@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: example-org/ci-tools/../../../actions/github-script/v7@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          script: console.log("done")
