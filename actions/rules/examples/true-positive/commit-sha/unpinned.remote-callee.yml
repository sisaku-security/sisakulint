# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/commit-sha-remote, which the fact
#   workflow.definition answers with the workflow of the true positive
#   unpinned (unpinned.yml) of the rule, with on: workflow_call in place of
#   the on of unpinned.yml. The job passes its secrets with secrets:
#   inherit. In the true positive, a step uses actions/checkout by the tag
#   v4.
# reason: the jobs of a reusable workflow run on the event that started the
#   run of the calling job, so the reason of the true positive holds: the
#   runner resolves @v4 to the commit the tag names when the job runs, not
#   to one this workflow chose, and v4 is a major tag, which the maintainers
#   of actions/checkout move to each new v4 release.
# attack: the owner of actions/checkout, or whoever has taken over a token
#   that pushes to it, moves the tag v4 to a commit of theirs, as the tags
#   v1 to v45.0.7 of tj-actions/changed-files were moved in 2025 to a commit
#   that prints secrets to the log.
# attack-run-behavior: when the job runs, the runner resolves @v4 to that
#   commit instead of 11d5960a, downloads it and runs its action as the
#   step, in the job's workspace and environment, with the GITHUB_TOKEN
#   actions/checkout takes by default; the moved commit of
#   tj-actions/changed-files printed the job's secrets to the log.
on: push
jobs:
  c:
    uses: example-org/commit-sha-remote/.github/workflows/w.yml@v1
    secrets: inherit
