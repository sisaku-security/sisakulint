# situation: on status, which an app outside GitHub Actions starts when the
#   app writes a status for a commit, the job writes the message of the
#   commit of the status (github.event.commit.commit.message) into the key
#   of a cache that the job saves (cache-mode: write, which makes the save
#   of the run of status reach the scope of the default branch).
# reason: an outside CI that writes a status for a commit of a pull request
#   from a fork starts a run of status on the default branch, with the
#   message of that commit, which the author of the pull request writes, in
#   the payload (seen on GitHub).
# attack-value: github.event.commit.commit.message = "main"
# attack-run-behavior: an outside CI writes a status for the commit of the
#   pull request from a fork whose message is the value; the run of status
#   starts on the default branch, and the key build-main is the key that a
#   job on the default branch restores, so the cache that the job saves
#   reaches that job.
on: status
jobs:
  j:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - uses: actions/cache/save@v4
        with:
          path: build
          key: build-${{ github.event.commit.commit.message }}
