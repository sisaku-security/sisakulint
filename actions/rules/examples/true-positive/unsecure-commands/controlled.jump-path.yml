# situation: on issues, a job sets ACTIONS_ALLOW_UNSECURE_COMMANDS to true
#   in its env; a step passes the title of the issue in the environment
#   variable T, defines a function f that returns when STOP is empty and
#   sets T to a fixed word after the return, calls f, and prints T; a step
#   comes after.
# reason: STOP is not set in the step, so f
#   returns before the assignment, T holds the title when echo runs, and
#   the step prints the title.
# attack: the attacker titles the issue ##[set-env name=BASH_ENV;]$(id).
# attack-run-behavior: the step prints the title, and the runner sets
#   BASH_ENV for the steps after.
on: issues
permissions: {}
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - env:
          T: ${{ github.event.issue.title }}
        run: |
          f() { [ -z "$STOP" ] && return; T=safe; }
          f
          echo "issue: $T"
      - run: echo next
