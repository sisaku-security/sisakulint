# situation: on issues, three jobs write the title of the issue into a run
#   script by ${{ }}, in the three ways of three advisories. The job discord is
#   discord-issue.yml of gouef/githubtoplanguages (commit
#   5aaf90fbe97dbc2473acf60ef2a46f21a9fea263, the parent of the fix
#   157840482e592bd4f8e0617539e73cdbef26f1ac, lines 3-17): an assignment in
#   double quotes. The other assignments and the curl to the webhook (lines
#   15-16 and 18-24) are left out, and the expression of line 17, which also
#   names the title of a pull request after ||, keeps only the title of the
#   issue, as the workflow runs only on issues. The job release is
#   release-candidate.yaml of Tiryoh/actions-mkdocs (v0.24.0, commit
#   14d3fd544b7a2bcffcdd86b05d558f20c244c9fc, lines 5-12, 26-28 and 32): a word
#   with no quotes, in a job whose if needs a title that starts with "Release ".
#   The steps before, the lines of git config and git remote (lines 29-31) and
#   the lines after line 32 are left out. The job zenclaw is zenclaw-discord.yml
#   of SHAdd0WTAka/Zen-Ai-Pentest (commit
#   07e65c72656a8213fc9ece2b3f4fc719032cfc5d, lines 60-84 and 100): an
#   assignment in double quotes inside a case. The other cases of the case
#   statement, for the other events, the lines of the case issues that set the
#   color (lines 76-82), and the steps before and after the step are left out,
#   and line 64, EVENT="${{ github.event_name }}", is written with the value
#   issues, so that the script has the title as its only ${{ }}.
# reason: anyone who opens an issue writes its title, and the runner puts the
#   title into each script before bash reads the script, so a $( ) in the title
#   runs as a command in all three ways: inside double quotes and in a word with
#   no quotes.
# attack-value: github.event.issue.title = "Release $(echo PWNED > /proc/$$/fd/1)"
# attack-run-behavior: in each script, bash runs the command substitution of
#   the title while it reads the line; $$ inside the substitution is the process
#   ID of the shell of the script, so echo writes PWNED to the standard output
#   of the script, and the line PWNED appears in the log of each step.
# advisory: https://github.com/advisories/GHSA-c3xh-98xp-6qhf
# advisory: https://github.com/advisories/GHSA-6p2j-742g-835f
# advisory: https://github.com/advisories/GHSA-f67f-hcr6-94mf
on:
  issues:
    types: [opened, reopened, closed]
jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Discord
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'Release ')
    steps:
      - name: Create release branch
        run: |
          export VERSION=$(echo ${{ github.event.issue.title }} | sed -E 's/Release v?([0-9\.]*)/\1/g')
  zenclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Notification
        run: |
          EVENT="issues"
          case "$EVENT" in
            issues)
              DESCRIPTION="${{ github.event.issue.title }}"
              ;;
          esac
