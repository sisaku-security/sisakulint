# situation: on issues opened, a step passes the issue's title in the
#   environment variable T, defines a function f that returns when STOP is
#   empty and sets T to a fixed word after the return, calls f, and runs T
#   with eval.
# reason: STOP is not set in the step, so f
#   returns before the assignment, T holds the title when eval runs, and
#   eval runs the title as code.
# attack-value: github.event.issue.title = "echo PWNED"
# attack-run-behavior: eval runs the title, which prints "PWNED".
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ github.event.issue.title }}
        run: |
          f() { [ -z "$STOP" ] && return; T=safe; }
          f
          eval "$T"
