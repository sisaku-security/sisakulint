# situation: on an opened issue, a step passes the issue's title in the
#   environment variable ISSUE_TITLE and runs eval on the variable, after an
#   assignment of an element of an array before the command word.
# reason: bash refuses the assignment of the element before the command word
#   and runs eval, which reads the title as code.
# attack-value: github.event.issue.title = "echo PWNED"
# attack-run-behavior: eval runs echo PWNED and prints PWNED.
on:
  issues:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          a[0]=x eval "$ISSUE_TITLE"
