# situation: a composite action with no caller among the files that the linter
#   reads, whose step writes the head branch of the workflow_run into run by
#   ${{ }}. The step is the step Select all requested test configurations of
#   .github/actions/filter-test-configs/action.yml of pytorch/pytorch (commit
#   ec26947c586dd323d741da80008403664c533f65, lines 90-110); the env, the
#   echo lines and the arguments other than --branch are left out.
# reason: with no caller among the files that the linter reads, the rule reads
#   the action on every event an attacker triggers, workflow_run among the
#   events. On workflow_run, the author of a pull request from a fork names the
#   head branch of the run that triggers it, which
#   github.event.workflow_run.head_branch gives, and the runner puts the name
#   into the script before bash reads the script, so a " in the name ends the
#   string and the rest runs as commands.
# attack-value: github.event.workflow_run.head_branch = "x\";echo${IFS}PWNED;#"
# attack-run-behavior: the author of a pull request from a fork names its head
#   branch x";echo${IFS}PWNED;# (a name of a branch has no space, and ${IFS}
#   stands for one), and the workflow_run follows the run of the pull request.
#   The step runs python3 with --branch "x", then echo PWNED, which prints
#   PWNED, and the # makes the rest of the line a comment.
# advisory: https://github.com/advisories/GHSA-hw6r-g8gj-2987
# advisory: https://securitylab.github.com/advisories/GHSL-2023-181_Pytorch/
name: Filter test configs matrix
description: a step that writes the head branch of the workflow_run into run
runs:
  using: composite
  steps:
    - name: Select all requested test configurations
      shell: bash
      id: filter
      run: |
        python3 "${GITHUB_ACTION_PATH}/../../scripts/filter_test_configs.py" \
          --branch "${{ github.event.workflow_run.head_branch }}"
