# situation: on pull_request_target, actions/checkout v2.3.4 checks out the
#   head commit of the pull request, and later steps run yarn install and yarn
#   build over the checkout; a step after them has the AWS secrets in its env.
#   This is create_pr_package.yaml of redwoodjs/redwood (commit
#   acb4ecf523fc11c656cd31b86d9c9a58ffef1af9, lines 1-28 and 42-45), with
#   actions/checkout@v2 pinned to v2.3.4, a release of the tag v2 before the
#   release of v2 that refuses the code of a fork (v2.8.0, which the tag v2 now
#   names); the step that packs and the defaults of the job are left out, and
#   the run of the step that copies to S3 is shortened to aws s3 ls. The other advisories listed below, from
#   2020 and 2021, have the same form: on pull_request_target, a step uses
#   actions/checkout@v2 with the head sha, the head ref or refs/pull/<number>/…
#   of the pull request, and later steps run what the checkout brings. With
#   their actions/checkout@v2 pinned to v2.3.4, untrusted-checkout reports
#   .executed or .checkout on each (2026-11-10). The workflows of
#   GHSL-2020-314 (s4u/pgpverify-maven-plugin), GHSL-2021-005 (OpenRefine) and
#   GHSL-2020-367 (Android-Password-Store) already use v2.3.4, and
#   untrusted-checkout reports them unchanged. One of the three workflows of
#   GHSL-2020-246 (ant-design) uses actions/checkout@master. GHSL-2020-266
#   (afc163/surge-preview) is an action that runs the build script of its
#   input, npm install and npm run build by default, over the checkout of the
#   pull request in the usage example of its documentation. The pages of
#   GHSL-2020-244, GHSL-2020-370 and GHSL-2021-007 have this form as their
#   Issue 1 and a code injection as their Issue 2, which examples of
#   code-injection cite. The pages of GHSL-2020-371 (tophat) and
#   GHSL-2021-008 (actions-cool/issues-helper, with afc163/surge-preview)
#   show only excerpts of their workflows.
# reason: pull_request_target runs the job with the base repository's token
#   and its secrets, while head.sha is the commit the author of the pull
#   request, from a fork too, pushed; yarn runs the package.json of the
#   checkout.
# attack: the author of a pull request from a fork changes the script build of
#   package.json and opens the pull request.
# attack-run-behavior: yarn build runs the author's script with the base
#   repository's token, which the checkout left in .git/config, and the AWS
#   secrets come to the job in a later step.
