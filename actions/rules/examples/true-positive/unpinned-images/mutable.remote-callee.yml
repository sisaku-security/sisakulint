# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/unpinned-images-remote, which the fact
#   workflow.definition answers with the workflow of the true positive
#   mutable (mutable.remote-action.yml) of the rule, with on: workflow_call
#   in place of the on of mutable.remote-action.yml. The job passes its
#   secrets with secrets: inherit. In the true positive, a step runs
#   example-org/docker-action@v1, a Docker container action of another
#   repository whose runs.image is docker://ghcr.io/o/scan:1, named by a tag
#   and no digest.
# reason: the jobs of a reusable workflow run on the event that started the
#   run of the calling job, so the reason of the true positive holds: the
#   runner pulls the image the tag 1 names when the step runs;
#   action.definition answers the file of the action, as the archive the
#   runner downloads has it.
# attack: whoever can push to ghcr.io/o/scan pushes an image of theirs under
#   the tag 1.
# attack-run-behavior: the runner pulls ghcr.io/o/scan:1, which is now that
#   image, and runs the step inside it with the workspace mounted.
on: push
jobs:
  c:
    uses: example-org/unpinned-images-remote/.github/workflows/w.yml@v1
    secrets: inherit
