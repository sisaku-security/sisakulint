# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/unsound-contains-remote, which the fact
#   workflow.definition answers with the workflow of the true positive
#   substring (substring.review.yml) of the rule, with on: workflow_call in
#   place of the on of substring.review.yml. The job passes its secrets with
#   secrets: inherit. In the true positive, on pull_request_review_comment,
#   the job runs ./deploy.sh with secrets.DEPLOY_TOKEN only if
#   contains('alice bob', the commenter's login) holds.
# reason: the jobs of a reusable workflow run on the event that started the
#   run of the calling job, so the reason of the true positive holds: any
#   login that is a part of 'alice bob', such as ali, passes the if, and
#   anyone with such a login can comment on the diff of a pull request from
#   a branch of the repository, whose run has the secrets.
# attack-value: github.event.comment.user.login = "ali"
# attack-run-behavior: a comment by the account ali on the diff of a pull
#   request whose branch is in the repository starts the job deploy;
#   contains('alice bob', 'ali') is true, so ./deploy.sh runs with TOKEN set
#   to DEPLOY_TOKEN's value.
on: pull_request_review_comment
jobs:
  c:
    uses: example-org/unsound-contains-remote/.github/workflows/w.yml@v1
    secrets: inherit
