# situation: on push, a job on a self-hosted runner sends the secret API_KEY
#   with curl to localhost:9200; no file of facts answers for the pair.
# reason: the machine of a self-hosted runner outlives the job, so a process
#   another job left, or a service of the machine, may listen on
#   localhost:9200 and receive the key.
# attack: the attacker leaves a process listening on port 9200 of the
#   runner, in a job of the attacker's own that ran on the same machine.
# attack-run-behavior: curl sends the request with the password to the
#   attacker's process, which logs the password.
on: push
jobs:
  j:
    runs-on: [self-hosted, linux]
    steps:
      - shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -fsS -u "admin:$API_KEY" http://localhost:9200/_cluster/health
