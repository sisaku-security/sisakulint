# situation: a job calls the reusable workflow .github/workflows/w.yml of
#   the repository example-org/secret-exfiltration-remote, which the fact
#   workflow.definition answers with the workflow of the true positive
#   untrusted-destination (untrusted-destination.arithmetic.yml) of the
#   rule, with on: workflow_call in place of the on of
#   untrusted-destination.arithmetic.yml. The job passes its secrets with
#   secrets: inherit. In the true positive, on push, a step sends the secret
#   API_KEY to hooks.example.com with curl, in a $( ) inside $(( )).
# reason: the jobs of a reusable workflow run on the event that started the
#   run of the calling job, so the reason of the true positive holds: bash
#   expands the $( ) inside $(( )) before it evaluates the expression, so
#   curl runs and the request carries the secret to the host.
# attack: the attacker takes over the server of the destination, by a breach
#   of the vendor or by registering the domain when the domain lapses.
# attack-run-behavior: curl sends the secret to hooks.example.com, whose
#   server, now the attacker's, logs the secret.
on: push
jobs:
  c:
    uses: example-org/secret-exfiltration-remote/.github/workflows/w.yml@v1
    secrets: inherit
